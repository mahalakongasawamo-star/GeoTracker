services:
  postgres:
    image: postgres:16-alpine
    container_name: geotracker-postgres
    environment:
      POSTGRES_USER: geotracker
      POSTGRES_PASSWORD: geotracker
      POSTGRES_DB: geotracker
    ports:
      - "5432:5432"
    volumes:
      - geotracker-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: geotracker-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  geotracker-pg:
